<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <title>DSH 远程</title>
  <script>
    // 网关可能挂在子路径（如 /m/）下：统一补尾斜杠，保证相对路径正确解析
    if (location.pathname.slice(-1) !== '/') location.replace(location.pathname + '/' + location.search)
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 主界面 -->
  <div id="app" class="app">
    <header class="topbar">
      <div class="topbar-left">
        <span class="status-dot" id="status-dot" title=""></span>
        <strong data-i18n="appName">DSH 远程</strong>
      </div>
      <div class="topbar-right">
        <button id="settings-btn" class="chip gear" data-i18n="settings">⚙ 设置</button>
      </div>
    </header>

    <nav class="tabs">
      <button id="tab-sessions" class="tab active" data-i18n="tabSessions">会话</button>
      <button id="tab-workspaces" class="tab" data-i18n="tabWorkspaces">工作区</button>
    </nav>

    <div id="need-login" class="banner hidden">
      <span data-i18n="needLogin">未连接：请点击右上角 ⚙ 输入密码</span>
    </div>

    <!-- 会话列表 -->
    <main id="view-sessions" class="view">
      <input id="search" class="searchbox" type="search" placeholder="搜索会话内容…">
      <div id="workspace-chips" class="chips"></div>
      <div id="session-list" class="list"></div>
      <button id="new-session-btn" class="fab" title="新建会话">＋</button>
    </main>

    <!-- 工作区列表 -->
    <main id="view-workspaces" class="view hidden">
      <div id="workspace-list" class="list"></div>
      <button id="add-workspace-btn" class="fab" title="添加工作区">＋</button>
    </main>

    <!-- 会话详情（全屏覆盖） -->
    <section id="detail" class="detail hidden">
      <header class="detail-head">
        <button id="detail-back" class="chip">←</button>
        <div class="detail-title-wrap">
          <div id="detail-title" class="detail-title">…</div>
          <div id="detail-sub" class="detail-sub"></div>
        </div>
        <button id="detail-menu" class="chip">⋯</button>
      </header>
      <div id="approval-area" class="approval-area"></div>
      <div id="messages" class="messages"></div>
      <div class="inputbar">
        <div class="inputbar-left">
          <button id="attach-btn" class="chip" title="图片">📎</button>
          <input id="attach-input" type="file" accept="image/*" class="hidden">
        </div>
        <div id="attachments" class="attachments hidden"></div>
        <textarea id="input" rows="1" placeholder="消息（/ 开头为命令）"></textarea>
        <button id="send-btn" class="btn primary send" data-i18n="send">发送</button>
      </div>
    </section>

    <!-- 文件浏览（模态） -->
    <section id="file-browser" class="modal hidden">
      <div class="modal-card">
        <header class="modal-head">
          <button id="fb-back" class="chip">←</button>
          <div id="fb-path" class="fb-path"></div>
          <button id="fb-new-folder" class="chip">＋ 文件夹</button>
        </header>
        <div id="fb-list" class="list"></div>
      </div>
    </section>

    <!-- 模型选择（模态） -->
    <section id="model-picker" class="modal hidden">
      <div class="modal-card">
        <header class="modal-head">
          <button id="mp-close" class="chip">✕</button>
          <div class="fb-path" data-i18n="selectModel">选择模型</div>
        </header>
        <div id="mp-list" class="list"></div>
      </div>
    </section>

    <!-- 新建会话（模态） -->
    <section id="new-session-modal" class="modal hidden">
      <div class="modal-card">
        <header class="modal-head">
          <button id="ns-close" class="chip">✕</button>
          <div class="fb-path" data-i18n="newSession">新建会话</div>
        </header>
        <div class="form">
          <label data-i18n="workspace">工作区</label>
          <select id="ns-workspace"></select>
          <label data-i18n="cwd">工作目录（留空用工作区路径）</label>
          <input id="ns-cwd" type="text">
          <label data-i18n="preset">Agent 预设（可选）</label>
          <select id="ns-preset"></select>
          <button id="ns-create" class="btn primary" data-i18n="create">创建</button>
        </div>
      </div>
    </section>

    <!-- 会话菜单（模态） -->
    <section id="session-menu" class="modal hidden">
      <div class="modal-card">
        <header class="modal-head">
          <button id="sm-close" class="chip">✕</button>
          <div class="fb-path" data-i18n="sessionActions">会话操作</div>
        </header>
        <div class="menu">
          <button id="sm-rename" class="menu-item" data-i18n="rename">重命名</button>
          <button id="sm-fork" class="menu-item" data-i18n="fork">派生副本</button>
          <button id="sm-model" class="menu-item" data-i18n="selectModel">选择模型</button>
          <button id="sm-goal" class="menu-item" data-i18n="setGoal">设置目标</button>
          <button id="sm-cancel" class="menu-item" data-i18n="cancelRun">停止运行</button>
          <button id="sm-delete" class="menu-item danger" data-i18n="deleteSession">删除会话</button>
        </div>
      </div>
    </section>

    <!-- 设置（模态）：语言 + 密码 -->
    <section id="settings" class="modal hidden">
      <div class="modal-card">
        <header class="modal-head">
          <button id="settings-close" class="chip">✕</button>
          <div class="fb-path" data-i18n="settings">设置</div>
        </header>
        <div class="form">
          <label data-i18n="language">语言 / Language</label>
          <div class="lang-btns">
            <button id="lang-zh" class="btn lang-btn">中文</button>
            <button id="lang-en" class="btn lang-btn">English</button>
          </div>

          <label data-i18n="password">密码</label>
          <input id="set-password" type="password" placeholder="••••••••" autocomplete="current-password">
          <button id="set-login" class="btn primary" data-i18n="saveLogin">保存并登录</button>

          <div id="set-change-area" class="hidden">
            <label data-i18n="oldPassword">原密码</label>
            <input id="set-old" type="password" placeholder="••••••••" autocomplete="current-password">
            <label data-i18n="newPassword">新密码（至少 8 位）</label>
            <input id="set-new" type="password" placeholder="••••••••" autocomplete="new-password">
            <button id="set-change" class="btn" data-i18n="changePassword">修改密码</button>
          </div>

          <button id="set-logout" class="btn danger hidden" data-i18n="logout">退出登录</button>
          <p id="set-msg" class="login-error"></p>
        </div>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
