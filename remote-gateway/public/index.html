<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>DSH 远程</title>
  <script>
    // 网关可能挂在子路径（如 /m/）下：统一补尾斜杠，保证相对路径正确解析
    if (location.pathname.slice(-1) !== '/') location.replace(location.pathname + '/' + location.search)
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 登录 -->
  <div id="login" class="login hidden">
    <div class="login-card">
      <img src="icon.svg" alt="logo" class="login-logo">
      <h1 data-i18n="appName">DSH 远程控制</h1>
      <p class="login-hint" data-i18n="tokenHint">请输入访问令牌（电脑端 remote-gateway/.env 中的 GATEWAY_TOKEN）</p>
      <input id="token-input" type="password" placeholder="••••••••" autocomplete="off">
      <button id="token-submit" class="btn primary" data-i18n="connect">连接</button>
      <p id="login-error" class="login-error"></p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="status-dot" id="status-dot" title=""></span>
        <strong data-i18n="appName">DSH 远程</strong>
      </div>
      <div class="topbar-right">
        <button id="lang-toggle" class="chip">EN</button>
        <button id="logout-btn" class="chip" data-i18n="logout">退出</button>
      </div>
    </header>

    <nav class="tabs">
      <button id="tab-sessions" class="tab active" data-i18n="tabSessions">会话</button>
      <button id="tab-workspaces" class="tab" data-i18n="tabWorkspaces">工作区</button>
    </nav>

    <!-- 会话列表 -->
    <main id="view-sessions" class="view">
      <div id="workspace-chips" class="chips"></div>
      <div id="session-list" class="list"></div>
      <button id="new-session-btn" class="fab" title="新建会话">＋</button>
    </main>

    <!-- 工作区列表 -->
    <main id="view-workspaces" class="view hidden">
      <div id="workspace-list" class="list"></div>
      <button id="add-workspace-btn" class="fab" title="添加工作区">＋</button>
    </main>

    <!-- 会话详情（全屏覆盖） -->
    <section id="detail" class="detail hidden">
      <header class="detail-head">
        <button id="detail-back" class="chip">←</button>
        <div class="detail-title-wrap">
          <div id="detail-title" class="detail-title">…</div>
          <div id="detail-sub" class="detail-sub"></div>
        </div>
        <button id="detail-menu" class="chip">⋯</button>
      </header>
      <div id="approval-area" class="approval-area"></div>
      <div id="messages" class="messages"></div>
      <div class="inputbar">
        <textarea id="input" rows="1" placeholder="消息（/ 开头为命令）"></textarea>
        <button id="send-btn" class="btn primary send" data-i18n="send">发送</button>
      </div>
    </section>

    <!-- 文件浏览（模态） -->
    <section id="file-browser" class="modal hidden">
      <div class="modal-card">
        <header class="modal-head">
          <button id="fb-back" class="chip">←</button>
          <div id="fb-path" class="fb-path"></div>
        </header>
        <div id="fb-list" class="list"></div>
      </div>
    </section>

    <!-- 模型选择（模态） -->
    <section id="model-picker" class="modal hidden">
      <div class="modal-card">
        <header class="modal-head">
          <button id="mp-close" class="chip">✕</button>
          <div class="fb-path" data-i18n="selectModel">选择模型</div>
        </header>
        <div id="mp-list" class="list"></div>
      </div>
    </section>

    <!-- 新建会话（模态） -->
    <section id="new-session-modal" class="modal hidden">
      <div class="modal-card">
        <header class="modal-head">
          <button id="ns-close" class="chip">✕</button>
          <div class="fb-path" data-i18n="newSession">新建会话</div>
        </header>
        <div class="form">
          <label data-i18n="workspace">工作区</label>
          <select id="ns-workspace"></select>
          <label data-i18n="cwd">工作目录（留空用工作区路径）</label>
          <input id="ns-cwd" type="text">
          <button id="ns-create" class="btn primary" data-i18n="create">创建</button>
        </div>
      </div>
    </section>

    <!-- 会话菜单（模态） -->
    <section id="session-menu" class="modal hidden">
      <div class="modal-card">
        <header class="modal-head">
          <button id="sm-close" class="chip">✕</button>
          <div class="fb-path" data-i18n="sessionActions">会话操作</div>
        </header>
        <div class="menu">
          <button id="sm-rename" class="menu-item" data-i18n="rename">重命名</button>
          <button id="sm-fork" class="menu-item" data-i18n="fork">派生副本</button>
          <button id="sm-model" class="menu-item" data-i18n="selectModel">选择模型</button>
          <button id="sm-cancel" class="menu-item danger" data-i18n="cancelRun">停止运行</button>
        </div>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
